name: Flat Data - Weave Daily Trends

on:
  schedule:
    # M04: 每日台灣時間 00:00 執行 (UTC+8 = 前一天 UTC 16:00)
    - cron: '0 16 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/flat.yml'
      - 'scripts/**'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v1.x

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Create data directories
        run: mkdir -p data/raw data/daily

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Flat's post-job commits whatever it downloaded even when postprocess
      # exits non-zero — there is no opt-out. When the old source started
      # answering 200-with-no-rows on 2026-09-01 that pushed a broken commit
      # every night for eight nights, overwriting 37KB of good data with an
      # empty response. Checking the source before Flat runs at all is what
      # keeps a bad day from reaching main.
      - name: Pre-flight — verify the source has data
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Trending window: repos created in the last 7 days. A 30-day window
          # lets one breakout project hold the top slot for a month, which
          # flatlines the tapestry; 7 days keeps the roster turning over.
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

          # Authenticated: the search endpoint allows 10 requests/minute
          # unauthenticated and counts them per IP, and Actions runners share
          # egress IPs — so an unauthenticated call can be throttled by someone
          # else's job. A 403 here would reach postprocess as a `message` body,
          # and Flat would commit that instead of data.
          COUNT=$(curl -sfg -H 'User-Agent: data-tapestry-weaver' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/search/repositories?q=created:>$SINCE&sort=stars&order=desc&per_page=10" \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("items",[])))')

          echo "Source returned $COUNT repos for created:>$SINCE"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Source returned no repos — aborting before Flat can commit an empty day"
            exit 1
          fi

      - name: Fetch daily trending data
        uses: githubocto/flat@v3
        with:
          http_url: https://api.github.com/search/repositories?q=created:>${{ steps.preflight.outputs.since }}&sort=stars&order=desc&per_page=10
          # Flat issues its own request, so it needs the token too — otherwise
          # the pre-flight check passes authenticated while the fetch that
          # actually writes the file runs unauthenticated against a shared IP.
          authorization: Bearer ${{ secrets.GITHUB_TOKEN }}
          # H03: Use fixed filename to prevent unbounded growth
          downloaded_filename: data/raw/trending-latest.json
          postprocess: scripts/postprocess.ts

      - name: Weave the tapestry
        run: node scripts/weave.js

      # H03: Clean up old raw files (keep only latest)
      - name: Cleanup old raw files
        run: |
          cd data/raw
          ls -t *.json 2>/dev/null | tail -n +2 | xargs -r rm -f
          echo "✨ Cleaned up old raw files"

      # Stage 所有變更，讓 Flat Data 的 post-cleanup 統一 commit
      - name: Stage all changes for Flat Data commit
        run: |
          git add tapestry.svg data/ README.md
          echo "✅ Staged tapestry.svg, data/, README.md for commit"
